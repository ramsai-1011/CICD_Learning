name: MLOps CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Check project structure
        run: |
          test -d mlops_project
          test -f requirements.txt
          echo "Project structure looks valid"

      - name: Variable pass demo
        env:
          START_VALUE: '10'
        run: |
          python -m mlops_project.variable_flow --a "100" --b "0" --output-file artifacts/updated_value.txt

      - name: Reuse updated value
        run: |
          UPDATED_VALUE=$(cat artifacts/updated_value.txt)
          echo "Updated value from previous step: $UPDATED_VALUE"
          python -m mlops_project.variable_flow --a "100" --b "0" --output-file artifacts/updated_value.txt

      - name: Train model
        run: python -m mlops_project.train
