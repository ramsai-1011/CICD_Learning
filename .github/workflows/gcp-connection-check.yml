name: Check GCP connection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GCP configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [[ -z "$GCP_PROJECT_ID" ]]; then
            echo "::error::Configure the GCP_PROJECT_ID GitHub Actions secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/716459559070/locations/global/workloadIdentityPools/testing-github-action/providers/github-actions
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify credentials
        run: |
          gcloud auth print-access-token > /dev/null
          echo "Successfully authenticated to Google Cloud."
