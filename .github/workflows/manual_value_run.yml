name: Manual Value Runner

on:
  workflow_dispatch:
    inputs:
      a:
        description: First value
        required: true
        default: '40'
        type: number
      b:
        description: Second value
        required: true
        default: '60'
        type: number

jobs:
  validate-inputs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Validate a + b = 100
        run: |
          python -m mlops_project.variable_flow --a "${{ inputs.a }}" --b "${{ inputs.b }}" --output-file artifacts/validated_pair.txt

  production-promotion:
    needs: validate-inputs
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Promote to production
        run: |
          echo "Validation passed. Change is approved for production promotion."
