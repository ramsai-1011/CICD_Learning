name: GCP Cloud Function Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - non-prod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gcp.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Prepare function source
        run: |
          mkdir -p deploy-source
          cp gcp_function/main.py deploy-source/main.py
          printf 'functions-framework==3.*\n' > deploy-source/requirements.txt

      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy hello-http \
            --runtime python311 \
            --trigger-http \
            --allow-unauthenticated \
            --source deploy-source \
            --entry-point hello_http \
            --region "$REGION" \
            --project "$PROJECT_ID"

      - name: Calculate next patch version
        id: version
        run: |
          git fetch --tags --force
          version="$(python - <<'PY'
          import re
          import subprocess

          tags = subprocess.check_output(
              ["git", "tag", "--list"], text=True
          ).splitlines()
          versions = [
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := re.fullmatch(r"v(\\d+)\\.(\\d+)\\.(\\d+)", tag))
          ]
          if versions:
              major, minor, patch = max(versions)
              print(f"v{major}.{minor}.{patch + 1}")
          else:
              print("v1.0.0")
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next release: $version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "$version" --json tagName >/dev/null 2>&1; then
            echo "Release $version already exists; leaving it unchanged."
          else
            gh release create "$version" \
              --target "$GITHUB_SHA" \
              --title "$version" \
              --generate-notes
          fi
