name: GCP Cloud Function Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - non-prod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gcp.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Prepare function source
        run: |
          mkdir -p deploy-source
          cp gcp_function/main.py deploy-source/main.py
          printf 'functions-framework==3.*\n' > deploy-source/requirements.txt

      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy hello-http \
            --runtime python311 \
            --trigger-http \
            --allow-unauthenticated \
            --source deploy-source \
            --entry-point hello_http \
            --region "$REGION" \
            --project "$PROJECT_ID"
