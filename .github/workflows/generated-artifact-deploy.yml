name: Generated Artifact Deploy

on:
  push:
    branches:
      - main
      - non-prod
  pull_request:
    branches:
      - main
      - non-prod

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ github.base_ref == 'main' && 'prod' || github.ref_name == 'main' && 'prod' || 'non-prod' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate deployment artifact
        run: python scripts/generate_deploy_file.py

      - name: Show generated artifact
        run: |
          echo "Generated files:"
          ls -la artifacts
          echo "---"
          cat artifacts/deploy_config.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-config
          path: artifacts/deploy_config.json
