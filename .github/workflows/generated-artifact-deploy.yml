name: Generated Artifact Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate deployment artifact
        run: |
          python scripts/generate_deploy_file.py

      - name: Show generated artifact
        run: |
          echo "Generated files:"
          ls -la artifacts
          echo "---"
          cat artifacts/deploy_config.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-config
          path: artifacts/deploy_config.json
