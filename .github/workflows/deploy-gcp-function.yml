name: Deploy and test GCP function

on:
  push:
    branches:
      - non-prod

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    environment: non-prod
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Prepare function source
        run: |
          mkdir -p deploy-source
          cp gcp_function/main.py deploy-source/main.py
          printf 'functions-framework==3.*\n' > deploy-source/requirements.txt

      - name: Deploy function
        run: |
          gcloud functions deploy hello-http \
            --runtime python311 \
            --trigger-http \
            --source deploy-source \
            --entry-point hello_http \
            --region "$REGION" \
            --project "$PROJECT_ID"

      - name: Call function and verify response
        shell: bash
        run: |
          response="$(gcloud functions call hello-http \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --data='{"name":"GitHub Actions"}' \
            --format=json)"
          printf '%s\n' "$response"
          python -c 'import json, sys; outer=json.load(sys.stdin); result=outer.get("result"); result=json.loads(result) if isinstance(result, str) else result; assert result["status"] == "success" and result["name"] == "GitHub Actions", result' <<< "$response"
