[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-learning"
version = "0.1.0"
description = "Basic MLOps CI/CD learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.5.2",
]

[tool.setuptools]
packages = ["mlops_project"]
